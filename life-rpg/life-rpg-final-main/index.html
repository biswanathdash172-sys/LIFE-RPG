<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life RPG — Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <link rel="stylesheet" href="css/auth.css">
  <!-- Google Fonts: Inter & Sora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .auth-page-layout {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      gap: 40px;
      padding: 40px 24px 40px 24px;
      max-width: 1300px;
      margin: 0 auto;
      position: relative;
      z-index: 5;
    }

    .auth-visual-side {
      flex: 1.2 1 560px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      position: relative;
    }

    .auth-illustration {
      width: 100%;
      max-width: 640px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 70px rgba(0,212,200,.25));
      mix-blend-mode: screen;
      opacity: 0.95;
    }

    .auth-form-side {
      flex: 1 1 400px;
      max-width: 460px;
      display: flex;
      justify-content: center;
    }

    @media (max-width: 900px) {
      .auth-page-layout {
        flex-direction: column;
        gap: 32px;
        padding: 24px;
        justify-content: center;
      }
      .auth-visual-side {
        order: -1;
      }
      .auth-illustration {
        max-width: 320px;
      }
      .auth-form-side {
        max-width: 100%;
      }
    .input-wrap > i {
      position: absolute;
      left: 16px;
      color: var(--teal);
      font-size: 15px;
      pointer-events: none;
    }
    .input-wrap input {
      padding-right: 42px;
    }
    .input-wrap .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .input-wrap .toggle-pw i {
      position: static;
      left: auto;
      color: var(--text-muted);
      pointer-events: none;
      transition: color .2s;
    }
    .input-wrap .toggle-pw:hover i {
      color: var(--teal);
    }
  </style>
</head>
<body>

  <!-- Ocean Background -->
  <div class="ocean-scene">
    <div class="rays" id="auth-rays"></div>
    <div class="bubbles" id="auth-bubbles"></div>
  </div>

  <!-- Two-Column Auth Layout -->
  <div class="auth-page-layout">

    <!-- Left: Illustration -->
    <div class="auth-visual-side">
      <img src="assets/assets/login-illustration.png" alt="Time management illustration" class="auth-illustration">
    </div>

    <!-- Right: Auth Card (unchanged) -->
    <div class="auth-form-side">
      <div class="auth-wrapper">
        <div class="auth-card">

          <!-- Back to Home Link -->
          <a href="landing.html" class="back-home-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
          </a>

          <!-- Logo -->
          <a href="landing.html" class="auth-logo" style="text-decoration:none;color:inherit;">
            <img src="assets/logo.png" alt="Life RPG" class="auth-logo-icon">
            <div class="auth-logo-text">
              <h1>Life RPG</h1>
              <p>Small Steps · Big Changes</p>
            </div>
          </a>

          <!-- Heading -->
          <h2 class="auth-heading" id="auth-heading">Welcome Back <span>🌊</span></h2>

          <!-- Tab Toggle -->
          <div class="auth-tabs">
            <button class="auth-tab active" data-mode="login">Sign In</button>
            <button class="auth-tab"        data-mode="signup">Create Account</button>
          </div>

          <!-- Alert -->
          <div class="auth-alert" id="auth-alert"></div>

          <!-- Form -->
          <form class="auth-form" id="auth-form" autocomplete="off">

            <!-- Name (signup only) -->
            <div class="form-group" id="signup-name-group" style="display:none;flex-direction:column;gap:8px">
              <label for="auth-name">Full Name</label>
              <div class="input-wrap">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="auth-name" placeholder="Your full name" autocomplete="off">
              </div>
            </div>

            <!-- Email -->
            <div class="form-group">
              <label for="auth-email">Email Address</label>
              <div class="input-wrap">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="off" required>
              </div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="auth-pass">Password</label>
              <div class="input-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="auth-pass" placeholder="Your password" autocomplete="off" required>
                <button type="button" class="toggle-pw" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
              </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-auth" id="auth-btn">
              <span class="btn-text" id="auth-btn-text">Sign In</span>
              <div class="btn-spinner"></div>
            </button>

          </form>

        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script>
    // Redirect if already logged in with a valid session
    (async () => {
      try {
        const u = await DB.auth.getUser();
        if (u) window.location.replace('app.html');
      } catch (e) {
        console.warn('Session check:', e);
      }
    })();
  </script>
  <script src="js/auth.js"></script>

</body>
</html>
